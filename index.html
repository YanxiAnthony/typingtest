<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Concept English</title>
  <link rel="stylesheet" href="assets/styles.css">
  <script src="assets/theme.js" defer></script>
  <script src="assets/resource-store.js" defer></script>
  <script src="assets/resources.js" defer></script>
  <script src="assets/default-library.js" defer></script>
  <script src="assets/library.js" defer></script>
</head>
<body>
  <div class="container">
    <header class="home-header">
      <button id="themeToggleBtn" class="icon-button theme-button" type="button" aria-label="切换深浅主题">◐</button>
      <p class="eyebrow">STUDY TEST</p>
      <h1>New Concept English</h1>
      <p>导入同名的 MP3 和 LRC，进行逐句听读与打字练习。</p>
    </header>

    <main class="library" aria-labelledby="libraryTitle">
      <div class="library-header">
        <div>
          <h2 id="libraryTitle">课程</h2>
          <span id="libraryCount" class="muted"></span>
        </div>
        <div class="library-actions">
          <select id="libraryFilter" aria-label="筛选课程">
            <option value="all">全部课程</option>
          </select>
          <button id="importOpenBtn" class="primary-button" type="button">＋ 导入其他资源</button>
        </div>
      </div>

      <section id="libraryEmpty" class="empty-state" hidden>
        <h2>还没有课程</h2>
        <p>选择包含 MP3 和同名 LRC 的文件夹即可开始。</p>
        <button id="emptyImportBtn" class="primary-button" type="button">选择文件夹</button>
      </section>

      <div id="lessonsGrid" class="lesson-grid"></div>
    </main>
  </div>

  <div id="importModal" class="modal-backdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="importTitle">
      <button id="importClose" class="modal-close" type="button" aria-label="关闭">×</button>
      <h2 id="importTitle">导入音频与字幕</h2>
      <p class="muted">MP3 和 LRC 文件名相同即可自动配对。</p>
      <div class="import-options">
        <button id="importFolderBtn" type="button"><strong>选择文件夹</strong><span>适合批量导入整个 NCE 目录</span></button>
        <button id="importFilesBtn" type="button"><strong>选择文件</strong><span>多选若干音频和 LRC</span></button>
        <button id="importZipBtn" type="button"><strong>选择 ZIP</strong><span>直接读取压缩包中的资源</span></button>
      </div>
      <p id="importStatus" class="import-status" aria-live="polite"></p>
      <input id="importFolderInput" type="file" webkitdirectory directory multiple hidden>
      <input id="importFilesInput" type="file" accept=".mp3,.m4a,.ogg,.wav,.lrc" multiple hidden>
      <input id="importZipInput" type="file" accept=".zip" hidden>
    </section>
  </div>
</body>
</html>
