<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>课程练习</title>
  <link rel="stylesheet" href="assets/styles.css">
  <script src="assets/theme.js" defer></script>
  <script src="assets/resource-store.js" defer></script>
  <script src="assets/lesson-core.js" defer></script>
  <script src="assets/typing-core.js" defer></script>
  <script src="assets/practice-store.js" defer></script>
  <script src="assets/lesson.js" defer></script>
  <script src="assets/typing-practice.js" defer></script>
</head>
<body class="lesson-page">
  <div class="container lesson-container">
    <nav class="topbar">
      <a class="secondary-button" href="index.html">← 课程</a>
      <nav id="practiceTabs" class="practice-tabs" aria-label="练习类型" role="tablist">
        <button class="active" type="button" role="tab" aria-selected="true" data-practice-mode="listen">音频 + 文字</button>
        <button type="button" role="tab" aria-selected="false" data-practice-mode="typing">文字 + 打字</button>
      </nav>
      <div class="topbar-actions">
        <label class="rate-control">倍速
          <select id="playbackRate" aria-label="播放速度">
            <option value="0.75">0.75×</option>
            <option value="1" selected>1×</option>
            <option value="1.25">1.25×</option>
            <option value="1.5">1.5×</option>
            <option value="2">2×</option>
          </select>
        </label>
        <label class="rate-control">单句播完
          <select id="sentenceMode" aria-label="单句播放完后的行为">
            <option value="once" selected>暂停</option>
            <option value="loop">单句循环</option>
            <option value="sequence">自动下一句</option>
          </select>
        </label>
        <label class="rate-control">整课播完
          <select id="lessonLoopMode" aria-label="整课播放完后的行为">
            <option value="once" selected>停止</option>
            <option value="loop">整课循环</option>
            <option value="multi">多课循环</option>
          </select>
        </label>
        <button id="multiLoopEdit" class="icon-button" type="button" aria-label="修改多课循环的课号" hidden>✎</button>
        <button id="themeToggleBtn" class="icon-button" type="button" aria-label="切换深浅主题">◐</button>
      </div>
    </nav>

    <header class="lesson-header">
      <p class="eyebrow">LESSON</p>
      <h1 id="lessonTitle">正在读取课程…</h1>
      <p id="lessonSub" class="muted"></p>
    </header>

    <main id="listenPractice">
      <div class="practice-intro"><strong>听读学习</strong><span>点击句子播放对应音频。</span></div>
      <div id="sentences" class="sentences"></div>
    </main>

    <main id="typingPractice" class="typing-practice" hidden>
      <div class="typing-stage">
        <aside class="typing-side typing-side-left" aria-label="练习状态">
          <div class="typing-side-heading">
            <span class="typing-kicker">练习状态</span>
            <span id="typingPosition">正在准备课文…</span>
            <span id="typingStatus" class="typing-status">输入第一个字符后开始计时</span>
            <span id="typingPracticeCount" class="typing-practice-count">全文完成 0 次</span>
          </div>
          <div class="typing-side-stats" aria-label="速度与准确率">
            <div><strong id="typingWpm">0</strong><span>WPM</span></div>
            <div><strong id="typingAccuracy">100%</strong><span>准确率</span></div>
          </div>
        </aside>

        <div class="typing-center">
          <div class="typing-heading">
            <div><span class="typing-kicker">跟打练习</span><h2>整篇课文连续跟打</h2></div>
          </div>
          <section class="typing-workspace" aria-label="全文跟打区">
            <div id="typingSentences" class="typing-article" aria-label="待输入的完整课文" aria-live="polite"></div>
            <label class="typing-input-label" for="typingInput">连续输入全文</label>
            <textarea id="typingInput" class="typing-input" rows="7" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="从文章开头开始输入…" aria-label="全文跟打输入框"></textarea>
          </section>
          <p class="typing-hint">全文已一次加载，原文框会跟随当前位置滚动；每句之间保留换行，换行处请按 Enter。点击原文句子可播放对应音频。</p>
        </div>

        <aside class="typing-side typing-side-right" aria-label="进度与操作">
          <div class="typing-side-stats" aria-label="用时与全文进度">
            <div><strong id="typingTime">0.0s</strong><span>用时</span></div>
            <div><strong id="typingProgress">0%</strong><span>全文进度</span></div>
          </div>
          <label class="typing-autoplay"><input id="typingAutoPlay" type="checkbox">进入下一句时自动播放</label>
          <div class="typing-actions">
            <button id="typingPlay" class="primary-button" type="button">▶ 播放当前句</button>
            <button id="typingReset" class="secondary-button" type="button">重新练习全文</button>
          </div>
        </aside>
      </div>
    </main>

    <nav class="lesson-nav" aria-label="课程导航">
      <a id="prevLesson" class="secondary-button" href="#" hidden>← 上一课</a>
      <a id="nextLesson" class="secondary-button" href="#" hidden>下一课 →</a>
    </nav>
  </div>

  <div class="bottom-player" role="region" aria-label="音频播放器">
    <span id="loopBadge" class="player-loop-badge" hidden></span>
    <button id="playPauseBtn" class="player-button" type="button" aria-label="播放或暂停">▶</button>
    <span id="currentTime" class="player-time">0:00</span>
    <div id="progressBar" class="player-progress" role="slider" aria-label="播放进度" tabindex="0">
      <div id="progressFilled"></div>
    </div>
    <span id="duration" class="player-time">0:00</span>
    <audio id="player" preload="metadata"></audio>
  </div>

  <div id="multiLoopModal" class="modal-backdrop" hidden>
    <section class="modal multi-loop-modal" role="dialog" aria-modal="true" aria-labelledby="multiLoopTitle">
      <button id="multiLoopClose" class="modal-close" type="button" aria-label="关闭">×</button>
      <h2 id="multiLoopTitle">多课循环</h2>
      <p id="multiLoopHint" class="muted"></p>
      <input id="multiLoopInput" class="multi-loop-input" type="text" inputmode="numeric" autocomplete="off" placeholder="例如：1,3 或 1-3" aria-label="要循环的课号">
      <p id="multiLoopStatus" class="import-status" aria-live="polite"></p>
      <div class="multi-loop-actions">
        <button id="multiLoopCancel" class="secondary-button" type="button">取消</button>
        <button id="multiLoopSave" class="primary-button" type="button">开始循环</button>
      </div>
    </section>
  </div>

  <div id="notification" class="notification" hidden></div>
</body>
</html>
